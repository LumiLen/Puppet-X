<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lenny Filler · Puppet-X — Grandpa</title>
  <link rel="icon" type="image/jpeg" href="../assets/favicon.jpg" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #000; color: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }

    /* Header */
    header { position: sticky; top: 0; z-index: 10; background: #000; border-bottom: 1px solid #222; }
    .nav { max-width: 1200px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
    .site-title { font-weight: 600; white-space: nowrap; }
    .menu { display: flex; gap: 18px; font-size: 14px; letter-spacing: 1.2px; }
    .menu a { color: #ddd; text-transform: uppercase; opacity: .85; text-decoration: none; }
    .menu a:hover { opacity: 1; }

    /* Back + title */
    .topbar { max-width: 1200px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; color:#bbb; }
    .topbar a { color:#bbb; text-decoration: none; }
    .topbar a:hover { color:#fff; }

    /* Viewer */
    main { max-width: 1200px; margin: 0 auto; padding: 16px; }
    .viewer {
      width: 100%;
      height: min(72vh, 78vw);
      background: #111; border: 1px solid #222; border-radius: 12px;
      position: relative; overflow: hidden; display: grid; place-items: center;
      margin-bottom: 20px;
    }
    .viewer img {
      max-width: 100%; max-height: 100%;
      object-fit: contain; display: block;
      user-select: none; -webkit-user-drag: none;
      transition: opacity .2s ease;
    }
    .arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 46px; height: 46px; border-radius: 999px; border: 1px solid #444;
      background: rgba(0,0,0,.5); color: #fff; display: grid; place-items: center;
      cursor: pointer; user-select: none;
    }
    .arrow.left { left: 10px; } .arrow.right { right: 10px; }
    .arrow:hover { background: rgba(255,255,255,.08); }
    .counter {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      padding: 6px 10px; border-radius: 999px; font-size: 13px; color:#eee;
      background: rgba(0,0,0,.5); border: 1px solid #444;
    }
    .caption {
      position: absolute; bottom: 10px; right: 10px; font-size: 13px; color:#ddd;
      background: rgba(0,0,0,.5); border: 1px solid #444; padding: 6px 10px; border-radius: 8px;
      max-width: 40ch; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;
    }

    /* Thumbnails: single centered column, ~12×4 cm each, full image visible */
    .thumbs {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px; /* spacing between thumbs */
    }
    .thumb {
      /* ~12×4 cm on wide screens, responsive on small */
      width: min(100%, 12cm);
      aspect-ratio: 3 / 1;           /* keeps ~12×4 proportion */
      border: 1px solid #222;
      border-radius: 10px;
      overflow: hidden;
      background: #111;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;            /* show the whole image inside */
      background: #000;               /* letterbox/pillarbox color */
      display: block;
      transition: transform .2s ease, opacity .2s ease;
    }
    .thumb:hover img { transform: scale(1.01); opacity: .95; }

    /* Footer */
    footer { border-top: 1px solid #222; background: #000; margin-top: 16px; }
    .footer-inner { max-width: 1200px; margin: 0 auto; padding: 12px 16px 20px; display: grid; place-items: center; gap: 6px; color: #aaa; text-align: center; }
    .footer-logo { width: 64px; height: 64px; border-radius: 50%; border: 1px solid #333; background: #111 center/cover no-repeat; background-image: url("../assets/favicon.jpg"); }
    .footer-brand { font-weight: 600; letter-spacing: .4px; color:#ddd; }
    .footer-rights { font-size: 13px; color: #888; }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="nav">
      <div class="site-title">Lenny Filler · Puppet-X</div>
      <nav class="menu" aria-label="primary">
        <a href="../index.html">Home</a>
        <a href="../works.html">Works</a>
        <a href="../words.html">Words</a>
        <a href="../gear.html">Gear</a>
        <a href="../contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Back + Title -->
  <div class="topbar">
    <a href="../works.html">← Back to Works</a>
    <div id="albumTitleBar">Grandpa</div>
  </div>

  <!-- Viewer -->
  <main>
    <div class="viewer" id="viewer">
      <button class="arrow left" id="prev" aria-label="Previous image">‹</button>
      <img id="photo" src="" alt="" />
      <button class="arrow right" id="next" aria-label="Next image">›</button>
      <div class="counter" id="counter">1 / 1</div>
      <div class="caption" id="caption"></div>
    </div>

    <!-- Thumbs: fixed ~12×4 cm, full image inside -->
    <section class="thumbs" id="thumbs"></section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-inner">
      <span class="footer-logo" aria-hidden="true"></span>
      <div class="footer-brand">lenZ</div>
      <div class="footer-rights">All rights reserved.</div>
    </div>
  </footer>

  <script>
    /* ====== CONFIG per album ====== */
    const albumTitle = "Grandpa";
    const images = [
      "assets/gp1.jpg",
      "assets/gp2.jpg",
      "assets/gp3.jpg",
      // add more...
    ];
    /* ============================== */

    // State + refs
    let i = 0;
    const photo   = document.getElementById('photo');
    const counter = document.getElementById('counter');
    const caption = document.getElementById('caption');
    const titleEl = document.getElementById('albumTitleBar');
    const thumbs  = document.getElementById('thumbs');

    function fileNameOnly(path) { return decodeURIComponent(path.split('/').pop()); }

    function show(idx) {
      if (!images.length) return;
      i = (idx + images.length) % images.length;
      const src = "../" + images[i]; // images live in /assets
      photo.style.opacity = 0;
      const img = new Image();
      img.onload = () => {
        photo.src = src;
        photo.alt = `${albumTitle} – ${fileNameOnly(images[i])}`;
        counter.textContent = `${i+1} / ${images.length}`;
        caption.textContent = fileNameOnly(images[i]);
        photo.style.opacity = 1;

        // mark active thumb
        [...thumbs.children].forEach((el, idx) => el.dataset.active = (idx === i ? "true" : "false"));
        thumbs.children[i]?.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
      };
      img.src = src;
    }
    function next(){ show(i+1); }
    function prev(){ show(i-1); }

    document.getElementById('next').addEventListener('click', next);
    document.getElementById('prev').addEventListener('click', prev);

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') next();
      if (e.key === 'ArrowLeft')  prev();
      if (e.key === 'Escape')     window.location.href = '../works.html';
    });

    // Touch swipe
    let startX = null;
    document.getElementById('viewer').addEventListener('touchstart', (e) => { startX = e.changedTouches[0].clientX; }, {passive:true});
    document.getElementById('viewer').addEventListener('touchend', (e) => {
      if (startX === null) return;
      const dx = e.changedTouches[0].clientX - startX;
      if (dx < -30) next(); if (dx > 30) prev();
      startX = null;
    }, {passive:true});

    // Build fixed-size thumbs (12×4 cm box, full image inside)
    function buildThumbs() {
      images.forEach((path, idx) => {
        const card = document.createElement('button');
        card.className = 'thumb';
        card.type = 'button';
        card.addEventListener('click', () => show(idx));

        const img = document.createElement('img');
        img.alt = fileNameOnly(path);
        img.decoding = 'async';
        img.loading = 'lazy';
        img.src = "../" + path;

        card.appendChild(img);
        thumbs.appendChild(card);
      });
    }

    // Init
    titleEl.textContent = albumTitle;
    buildThumbs();
    show(0);
  </script>
</body>
</html>
