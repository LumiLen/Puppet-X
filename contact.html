<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lenny Filler · Puppet-X — Contact</title>

  <link rel="icon" type="image/jpeg" href="assets/favicon.jpg" />

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: #fff;
      color: #111;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
    }
    .nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .site-title { font-weight: 600; letter-spacing: .3px; white-space: nowrap; }
    .menu {
      display: flex; flex-wrap: wrap; gap: 22px;
      font-size: 14px; letter-spacing: 1.2px;
    }
    .menu a { text-transform: uppercase; opacity: .85; }
    .menu a:hover, .menu a[aria-current="page"] { opacity: 1; font-weight: 600; }

    /* MAIN */
    main {
      max-width: 800px;
      margin: 60px auto;
      padding: 0 20px;
      text-align: center;
    }
    main h1 { font-size: 1.5rem; margin-bottom: 1em; }

    .profile-photo {
      width: 220px;
      height: auto;
      border-radius: 16px; /* rounded corners */
      object-fit: cover;
      margin: 0 auto 20px;
      display: block;
    }

    form {
      display: grid;
      gap: 16px;
      max-width: 500px;
      margin: 0 auto;
    }
    input, textarea, button {
      font: inherit;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    textarea { resize: vertical; min-height: 120px; }
    button {
      background: #111;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: background .2s;
    }
    button:hover { background: #444; }

    /* FOOTER */
    footer {
      border-top: 1px solid #e5e5e5;
      background: #fff;
    }
    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 20px 28px;
      display: grid;
      place-items: center;
      gap: 6px;
      color: #444;
      text-align: center;
    }
    .footer-logo {
      width: 88px; height: 88px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid #ddd;
      background: #fafafa center/cover no-repeat;
      background-image: url("assets/favicon.jpg");
    }
    .footer-brand { font-weight: 600; letter-spacing: .4px; }
    .footer-rights { font-size: 13px; color: #666; }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header>
    <div class="nav">
      <div class="site-title">Lenny Filler · Puppet-X</div>
      <nav class="menu" aria-label="primary">
        <a href="index.html">HOME</a>
        <a href="works.html">WORKS</a>
        <a href="words.html">WORDS</a>
        <a href="gear.html">GEAR</a>
        <a href="contact.html" aria-current="page">CONTACT</a>
      </nav>
    </div>
  </header>

  <!-- MAIN -->
  <main>
    <img src="assets/meweld.jpg" alt="Lenny Filler" class="profile-photo">

    <h1>Let’s Connect</h1>
    <p>I’m always happy to collaborate with others and explore new ideas together.  
       Feel free to reach out—I’d love to hear from you!</p>

    <!-- Netlify form -->
   <form name="contact"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      action="/contact-success.html">
  <input type="hidden" name="form-name" value="contact" />
  <p style="display:none;">
    <label>Don’t fill this out: <input name="bot-field" /></label>
  </p>

  <input type="text"   name="name"    placeholder="Your Name"   required />
  <input type="email"  name="email"   placeholder="Your Email"  required />
  <textarea            name="message" placeholder="Your Message" required></textarea>

  <button type="submit">Send</button>
</form>

  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-inner">
      <span class="footer-logo" aria-hidden="true"></span>
      <div class="footer-brand">Puppet-X</div>
      <div class="footer-rights">All rights reserved.</div>
    </div>
  </footer>
</body>
</html>
