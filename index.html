<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LenZ</title>

  <!-- FAVICON -->
  <link rel="icon" type="image/jpeg" href="assets/favicon.jpg" />

  <style>
    :root {
      --max-content-width: 1200px;
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: #fff;
      color: #111;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }
    a { color: inherit; text-decoration: none; }

    .topline {
      text-align: center;
      font-size: 14px;
      letter-spacing: .5px;
      padding: 6px 12px;
      background: #fafafa;
      border-bottom: 1px solid #e5e5e5;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
    }
    .nav {
      max-width: var(--max-content-width);
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      letter-spacing: .4px;
    }
    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      overflow: hidden;
      display: inline-block;
      border: 1px solid #ddd;
      background: #fafafa center/cover no-repeat;
      background-image: url("assets/favicon.jpg");
    }
    .menu {
      display: flex;
      gap: 22px;
      font-size: 14px;
      letter-spacing: 1.2px;
    }
    .menu a { text-transform: uppercase; opacity: .85; }
    .menu a:hover { opacity: 1; }

    main {
      min-height: calc(100vh - 160px);
      display: grid;
      place-items: center;
      padding: 40px 20px;
    }
    .frame {
      width: min(100%, var(--max-content-width));
      display: grid;
      place-items: center;
    }
    .hero {
      width: 15cm;
      height: 5cm;
      max-width: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      background: #f7f7f7;
      border: 1px solid #eee;
    }
    footer {
      border-top: 1px solid #e5e5e5;
      background: #fff;
    }
    .footer-inner {
      max-width: var(--max-content-width);
      margin: 0 auto;
      padding: 22px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #444;
      font-size: 14px;
    }
    .footer-logo {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      overflow: hidden;
      flex: none;
      border: 1px solid #ddd;
      background: #fafafa center/cover no-repeat;
      background-image: url("assets/favicon.jpg");
    }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
  <a href="#main" class="sr-only">Skip to content</a>

  <!-- TOP LINE -->
  <div class="topline">Lenny Filler  ·  Puppet-X</div>

  <header>
    <div class="nav">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true"></span>
        <span>LenZ</span>
      </div>
      <nav class="menu" aria-label="primary">
        <a href="#home">HOME</a>
        <a href="#works">WORKS</a>
        <a href="#words">WORDS</a>
        <a href="#gear">GEAR</a>
        <a href="#contact">CONTACT</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="frame" id="home">
      <img
        class="hero"
        src="assets/brnd.jpg"
        alt="Central artwork (15cm × 5cm)"
      />
    </section>
  </main>

  <footer>
    <div class="footer-inner">
      <span class="footer-logo" aria-hidden="true"></span>
      <span>LenZ — All rights reserved.</span>
    </div>
  </footer>
</body>
</html>
