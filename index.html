<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lenny Filler · Puppet-X</title>

  <link rel="icon" type="image/png" href="assets/favicon.png" />

  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: #fff;
      color: #111;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    a { color: inherit; text-decoration: none; }

    /* HEADER / NAV BAR */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
    }
    .nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .site-title {
      font-weight: 600;
      letter-spacing: .3px;
      white-space: nowrap;
    }
    .menu {
      display: flex;
      flex-wrap: wrap;
      gap: 22px;
      font-size: 14px;
      letter-spacing: 1.2px;
    }
    .menu a { text-transform: uppercase; opacity: .85; }
    .menu a:hover { opacity: 1; }

    /* MAIN VIDEO IN THE MIDDLE */
    main {
      min-height: calc(100vh - 200px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }
    .hero-video {
      max-width: 600px;   /* adjust if you want larger/smaller */
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      outline: none;
    }

    /* FOOTER */
    footer {
      border-top: 1px solid #e5e5e5;
      background: #fff;
    }
    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 26px 20px 40px;
      display: grid;
      place-items: center;
      gap: 10px;
      color: #444;
      text-align: center;
    }
    .footer-logo {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid #ddd;
      background: #fafafa center/cover no-repeat;
      background-image: url("assets/footfav.jpg");
    }
    .footer-brand {
      font-weight: 200;
      letter-spacing: .4px;
    }
    .footer-rights {
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>
  <!-- HEADER: Title and menu on the same bar -->
  <header>
    <div class="nav">
      <div class="site-title">Lenny Filler · Puppet-X</div>
      <nav class="menu" aria-label="primary">
        <a href="index.html">HOME</a>
        <a href="works.html">WORKS</a>
        <a href="words.html">WORDS</a>
        <a href="gear.html">GEAR</a>
        <a href="contact.html">CONTACT</a>
      </nav>
    </div>
  </header>

  <!-- MAIN VIDEO (centered) -->
  <main id="home">
    <video
      class="hero-video"
      autoplay
      muted
      playsinline
      preload="auto"
      defaultMuted
      poster=""
    >
      <source src="assets/pup.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </main>

  <!-- FOOTER with favicon and text under it -->
  <footer>
    <div class="footer-inner">
      <span class="footer-logo" aria-hidden="true"></span>
      <div class="footer-brand">Puppet-X</div>
      <div class="footer-rights">All rights reserved.</div>
    </div>
  </footer>
</body>
</html>
