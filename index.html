<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lenny Filler · Puppet-X</title>

  <link rel="icon" type="image/png" href="assets/favicon.png" />

  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: #fff;
      color: #111;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    a { color: inherit; text-decoration: none; }

    /* HEADER / NAV BAR */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
    }
    .nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .site-title {
      font-weight: 600;
      letter-spacing: .3px;
      white-space: nowrap;
    }
    .menu {
      display: flex;
      flex-wrap: wrap;
      gap: 22px;
      font-size: 14px;
      letter-spacing: 1.2px;
    }
    .menu a { text-transform: uppercase; opacity: .85; }
    .menu a:hover { opacity: 1; }

    /* MAIN LAYOUT */
    main {
      min-height: calc(100vh - 200px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      gap: 40px; /* space between video and box */
      position: relative;           /* create stacking context */
      z-index: 1;                   /* ensure main is above walker layer */
    }
    .hero-video {
      max-width: 600px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      outline: none;
      position: relative;
      z-index: 2;                   /* above walker */
    }

    /* NOTICE BOX */
    .notice-box {
      background: #000;
      border: 2px solid purple;
      color: #fff;
      padding: 16px 20px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 500;
      text-align: center;
      max-width: 280px;
      line-height: 1.4;
      opacity: 0;
      visibility: hidden;
      animation: blink 3s infinite ease-in-out;
      transition: opacity 1s ease, visibility 1s ease;
      position: relative;
      z-index: 2;                  /* above walker */
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .notice-box.show {
      opacity: 1;
      visibility: visible;
    }

    /* ===== WALKER LAYER (behind content) ===== */
    .walker-layer {
      position: fixed;             /* spans viewport, sits behind main */
      left: 0; right: 0; top: 0; bottom: 0;
      pointer-events: none;        /* don't block clicks */
      z-index: 0;                  /* behind main/video/box */
    }
    .walker {
      position: absolute;
      bottom: 12%;                 /* height above bottom of screen */
      width: 80px;                 /* figure size */
      height: 160px;
      opacity: 0.75;
      animation:
        walkAcross 10s ease-in-out 1 both,
        bob 0.6s ease-in-out infinite;
      transform-origin: 50% 100%;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.25));
    }

    /* Move across screen once */
    @keyframes walkAcross {
      0%   { transform: translateX(-20vw) scaleX(1); }
      100% { transform: translateX(120vw) scaleX(1); }
    }

    /* Gentle vertical bob to suggest walking */
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-4px); }
    }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .notice-box { animation: none; }
      .walker { animation: none; opacity: 0; }
    }

    /* FOOTER */
    footer {
      border-top: 1px solid #e5e5e5;
      background: #fff;
    }
    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 26px 20px 40px;
      display: grid;
      place-items: center;
      gap: 10px;
      color: #444;
      text-align: center;
    }
    .footer-logo {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid #ddd;
      background: #fafafa center/cover no-repeat;
      background-image: url("assets/footfav.jpg");
    }
    .footer-brand {
      font-weight: 200;
      letter-spacing: .4px;
    }
    .footer-rights {
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header>
    <div class="nav">
      <div class="site-title">Lenny Filler · Puppet-X</div>
      <nav class="menu" aria-label="primary">
        <a href="index.html">HOME</a>
        <a href="works.html">WORKS</a>
        <a href="words.html">WORDS</a>
        <a href="gear.html">GEAR</a>
        <a href="contact.html">CONTACT</a>
      </nav>
    </div>
  </header>

  <!-- WALKER LAYER (behind everything) -->
  <div class="walker-layer" aria-hidden="true">
    <!-- Stylized silhouette (SVG) -->
    <svg class="walker" viewBox="0 0 80 160" xmlns="http://www.w3.org/2000/svg">
      <!-- body -->
      <g fill="#111">
        <circle cx="40" cy="20" r="14" />                <!-- head -->
        <rect x="32" y="34" width="16" height="40" rx="8"/>  <!-- torso -->
        <!-- arms -->
        <path d="M32 40 C 10 60, 10 76, 28 84 L 32 78 Z" />
        <path d="M48 40 C 70 60, 70 76, 52 84 L 48 78 Z" />
        <!-- legs -->
        <path d="M36 74 L28 110 L34 112 L42 82 Z" />
        <path d="M44 74 L52 112 L58 110 L38 82 Z" />
      </g>
      <!-- subtle highlight -->
      <g fill="#000" opacity=".18">
        <ellipse cx="40" cy="150" rx="22" ry="6" />
      </g>
    </svg>
  </div>

  <!-- MAIN -->
  <main id="home">
    <video
      class="hero-video"
      autoplay
      muted
      playsinline
      preload="auto"
      defaultMuted
      poster=""
    >
      <source src="assets/pup.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <div class="notice-box" id="noticeBox">
      Put on your headphones and enjoy the music unique to each page.
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-inner">
      <span class="footer-logo" aria-hidden="true"></span>
      <div class="footer-brand">Puppet-X</div>
      <div class="footer-rights">All rights reserved.</div>
    </div>
  </footer>

  <script>
    // Show the notice box after 5 seconds
    window.addEventListener("load", () => {
      setTimeout(() => {
        document.getElementById("noticeBox").classList.add("show");
      }, 5000);
    });

    // Optional: start the walker a bit later for timing
    // (The CSS animation already runs automatically; uncomment below to delay by class toggle instead.)
    /*
    window.addEventListener("load", () => {
      const walker = document.querySelector(".walker");
      walker.style.animationPlayState = "paused";
      setTimeout(() => { walker.style.animationPlayState = "running"; }, 800);
    });
    */
  </script>
</body>
</html>
