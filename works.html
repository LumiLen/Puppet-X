<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lenny Filler · Puppet-X — Works</title>

  <link rel="icon" type="image/jpeg" href="assets/favicon.jpg" />

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: #fff;
      color: #111;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
    }
    .nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .site-title { font-weight: 600; }
    .menu { display: flex; gap: 22px; font-size: 14px; letter-spacing: 1.2px; }
    .menu a { text-transform: uppercase; opacity: .85; }
    .menu a:hover, .menu a[aria-current="page"] { opacity: 1; font-weight: 600; }

    /* MAIN */
    main {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .works-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5cm;   /* spacing between boxes */
    }
    .card {
      width: 100%;
      max-width: 600px;   /* control box width */
      height: 350px;      /* make them same height */
      border: 1px solid #ddd;
      border-radius: 10px;
      overflow: hidden;
      background: #f8f8f8;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 14px;
      text-align: center;
    }

    /* FOOTER */
    footer { border-top: 1px solid #e5e5e5; background: #fff; }
    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 20px 20px;
      display: grid;
      place-items: center;
      gap: 6px;
      text-align: center;
    }
    .footer-logo {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 1px solid #ddd;
      background: #fafafa center/cover no-repeat;
      background-image: url("assets/favicon.jpg");
    }
    .footer-brand { font-weight: 600; }
    .footer-rights { font-size: 13px; color: #666; }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header>
    <div class="nav">
      <div class="site-title">Lenny Filler · Puppet-X</div>
      <nav class="menu">
        <a href="index.html">HOME</a>
        <a href="works.html" aria-current="page">WORKS</a>
        <a href="words.html">WORDS</a>
        <a href="gear.html">GEAR</a>
        <a href="contact.html">CONTACT</a>
      </nav>
    </div>
  </header>

  <!-- MAIN -->
  <main>
    <div class="works-column">
      <div class="card">
        <img src="assets/project1.jpg" alt="Cardboard Marionette">
        <div class="overlay">Cardboard Marionette · 2025</div>
      </div>
      <div class="card">
        <img src="assets/project2.jpg" alt="Market Shadows">
        <div class="overlay">Market Shadows · 2024</div>
      </div>
      <div class="card">
        <img src="assets/project3.jpg" alt="Motion Study">
        <div class="overlay">Motion Study · 2023</div>
      </div>
      <!-- Add more cards as needed -->
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-inner">
      <span class="footer-logo" aria-hidden="true"></span>
      <div class="footer-brand">lenZ</div>
      <div class="footer-rights">All rights reserved.</div>
    </div>
  </footer>
</body>
</html>
